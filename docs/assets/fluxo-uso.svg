<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="t d">
  <title id="t">Fluxo de uso</title>
  <desc id="d">Cinco passos: instalar, criar operador e segredos, configurar câmeras e zonas, rodar o modo edge e revisar alertas na API.</desc>
  <style>
    :root { --bg: #ffffff; --card: #f6f8fa; --fg: #1f2328; --muted: #57606a; --line: #d0d7de; --accent: #0969da; --done: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --accent: #4493f8; --done: #3fb950; }
    }
    .bg { fill: var(--bg); stroke: var(--line); }
    .step { fill: var(--card); stroke: var(--line); stroke-width: 2; animation: hl 10s ease-in-out infinite; }
    .n { fill: var(--accent); font: 700 22px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h { fill: var(--fg); font: 700 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .c { fill: var(--muted); font: 500 10.5px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .link { stroke: var(--line); stroke-width: 2; }
    .s2 { animation-delay: 2s; } .s3 { animation-delay: 4s; } .s4 { animation-delay: 6s; } .s5 { animation-delay: 8s; }
    @keyframes hl { 0%, 18% { stroke: var(--done); } 22%, 100% { stroke: var(--line); } }
    @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  </style>
  <rect class="bg" x="1" y="1" width="898" height="228" rx="14"/>
  <line class="link" x1="60" y1="115" x2="840" y2="115"/>

  <rect class="step s1" x="20" y="30" width="160" height="170" rx="10"/>
  <text class="n" x="36" y="62">1</text>
  <text class="h" x="36" y="88">Instalar</text>
  <text class="c" x="36" y="140">pip install</text>
  <text class="c" x="36" y="156">-r requirements-ci.txt</text>

  <rect class="step s2" x="195" y="30" width="160" height="170" rx="10"/>
  <text class="n" x="211" y="62">2</text>
  <text class="h" x="211" y="88">Operador e segredos</text>
  <text class="c" x="211" y="140">python -m</text>
  <text class="c" x="211" y="156">src.tools.bootstrap_env</text>
  <text class="c" x="211" y="172">--operator admin</text>

  <rect class="step s3" x="370" y="30" width="160" height="170" rx="10"/>
  <text class="n" x="386" y="62">3</text>
  <text class="h" x="386" y="88">Câmeras e zonas</text>
  <text class="c" x="386" y="140">config.yaml:</text>
  <text class="c" x="386" y="156">cameras, analytics</text>

  <rect class="step s4" x="545" y="30" width="160" height="170" rx="10"/>
  <text class="n" x="561" y="62">4</text>
  <text class="h" x="561" y="88">Rodar na borda</text>
  <text class="c" x="561" y="140">python main.py</text>
  <text class="c" x="561" y="156">-c config.yaml -m edge</text>

  <rect class="step s5" x="720" y="30" width="160" height="170" rx="10"/>
  <text class="n" x="736" y="62">5</text>
  <text class="h" x="736" y="88">Revisar alertas</text>
  <text class="c" x="736" y="140">python main.py -m api</text>
  <text class="c" x="736" y="156">/docs · login JWT</text>
</svg>
