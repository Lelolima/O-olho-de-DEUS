[tool.poetry]
name = "olho-de-deus"
version = "3.0.0"
description = "Sistema de vigilancia com IA para deteccao facial e comportamental com conformidade LGPD"
authors = ["Lelolima <author@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# Visao computacional e ML
opencv-python = "^4.8.0"
numpy = "^1.24.0"
scipy = "^1.11.0"
onnxruntime = { version = "^1.15.0", optional = true }

# TensorRT (NVIDIA) ou OpenVINO (Intel) - instalar apenas um
# tensorrt = "^8.6.0"  # Uncomment se usar NVIDIA
# openvino = "^2023.0.0"  # Uncomment se usar Intel

# Criptografia e seguranca
cryptography = ">=46.0.0"
pyjwt = "^2.12.0"

# HTTP e webhooks
requests = "^2.33.0"
pyyaml = "^6.0.1"
aiohttp = "^3.13.4"

# FastAPI para backend cloud
fastapi = { version = ">=0.115.0", optional = true }
uvicorn = { version = ">=0.23.0", optional = true }
python-multipart = { version = ">=0.0.31", optional = true }

# Banco de dados
sqlalchemy = { version = "^2.0.0", optional = true }
psycopg = { version = "^3.3.0", extras = ["binary"], optional = true }


# GStreamer para RTSP
# gst-python = "^1.22.0"  # Requer instalacao manual do GStreamer

[tool.poetry.extras]
edge = ["onnxruntime"]
cloud = ["fastapi", "uvicorn", "python-multipart", "sqlalchemy", "psycopg", "pyjwt", "aiohttp"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
black = ">=26.10.1"
flake8 = "^6.1.0"
mypy = "^1.5.0"
pre-commit = "^3.4.0"

[tool.poetry.group.test.dependencies]
pytest = ">=9.0.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
responses = "^0.23.0"  # Mock de requests HTTP

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ""
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["LEGADO_v2.0.0"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF", "ASYNC", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # caracteres tipográficos em textos em português
    "S101",                         # assert é usado em testes
]

[tool.ruff.lint.flake8-bugbear]
# Padrão do FastAPI: dependências declaradas como valor padrão
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]       # senhas fictícias de teste
"examples/**" = ["S105", "S106"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true