name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      USE_SQLITE: "true"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Lint e formatação
        run: |
          ruff check src tests main.py examples
          ruff format --check src tests main.py examples
      - name: Tipagem (módulos centrais)
        run: >
          mypy src/edge src/forensic src/privacy src/tools src/envfile.py
          src/cloud/api/middleware/auth.py main.py
          --ignore-missing-imports --follow-imports=silent
      - name: Build
        run: |
          python -m compileall -q src main.py
          python -c "import src.hitl.dashboard_server"
      - name: Testes
        run: python -m pytest -q -p no:cacheprovider --cov=src --cov-report=term --cov-fail-under=70

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Build da imagem (sem push)
        run: docker build -f docker/Dockerfile -t olho-de-deus:ci .
      - name: Smoke test da imagem
        run: |
          docker run --rm olho-de-deus:ci python -c "import src.hitl.dashboard_server, src.edge.analytics; print('ok')"
          docker run --rm olho-de-deus:ci python examples/01_intrusao_fora_do_horario/run.py --saida /tmp/ex --sem-snapshots
